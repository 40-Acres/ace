{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // REC-1..REC-8 of the internal record, against the reused NftAccountRecord
    // the feeds and the factory are LINKED mocks; the account is DISPATCHED, since it arrives as a call argument
    // RecordHarness IS NftAccountRecord plus three getters and no state, so every method under test is the record's.
    // The record is not listed separately: a second instance in the scene would be a contract nothing calls.
    "files": [
        "verify/certora/harness/RecordHarness.sol",
        "verify/certora/harness/MockAggregator.sol",
        "verify/certora/harness/MockSequencer.sol",
        "verify/certora/harness/MockStakeAccount.sol",
        "verify/certora/harness/MockAccountFactory.sol"
    ],
    "verify": "RecordHarness:verify/certora/specs/SaeroRecord.spec",
    // Every address the record HOLDS is linked. An unlinked one is havoced PER CALL, so two reads in one rule disagree
    // and a twin rule fails on a state no chain can hold -- exactly what happened with SEQUENCER_FEED left out.
    // The account is not here and cannot be: `link` binds a field, and the collateral is a call argument.
    "link": [
        "RecordHarness:FEED=MockAggregator",
        "RecordHarness:SEQUENCER_FEED=MockSequencer",
        "RecordHarness:FACTORY=MockAccountFactory"
    ],
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    // The settle twin walks the feed's past rounds, up to MAX_HOLD_ROUNDS. The rules ABOUT the walk run in SaeroRecordWalk.conf
    // at its full 64 and are excluded here. What still reaches a walk here, the parametric dial rule calling the settle twin,
    // sees it bounded at two rounds, as every other conf here bounds its loops: a view writes no dial at any depth.
    "exclude_rule": ["theSettleTwinImpliesTheDistressTwin", "theSettleTwinCanAnswerBelow", "theSettleTwinNeverPanics"],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    "prover_args": ["-enableEventReporting false"],
    "msg": "sAERO record: REC-1..REC-9 and REC-12, the per-receipt price, its gate and the one read"
}
