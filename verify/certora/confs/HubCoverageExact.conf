{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // the MUNGED hub: its six libraries inlined, rebuilt by scripts/certora-munge.sh on every run
    "files": ["verify/certora/munged/harness/HubCoverageHarness.sol"],
    "verify": "HubCoverageHarness:verify/certora/specs/HubCoverageExact.spec",
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    "smt_timeout": "3600",
    "global_timeout": "28800",
    "prover_args": ["-enableEventReporting false"],
    "msg": "Ace hub: the keeper's bill, the close's size, the stop gate and settlement's split, exact mulDiv (O54, O63, O15, O50)"
}
