{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // Api3OracleRecord, the single-pair record over an API3 dAPI: A3-0..A3-7 of verify/certora/specs/Api3OracleRecord.spec
    // Api3OracleRecordHarness IS Api3OracleRecord plus getters and no state, so every method under test is the record's.
    // NOTHING IS LINKED, for OracleRecord.conf's reason: the proxy and both tokens are constructor arguments.
    "files": [
        "verify/certora/harness/Api3OracleRecordHarness.sol",
        "verify/certora/harness/MockApi3Proxy.sol",
        "verify/certora/harness/MockPairToken.sol:MockQuoteToken",
        "verify/certora/harness/MockPairToken.sol:MockCollateralToken"
    ],
    "verify": "Api3OracleRecordHarness:verify/certora/specs/Api3OracleRecord.spec",
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    "prover_args": ["-enableEventReporting false"],
    "msg": "Api3OracleRecord: the frame, the exact price, the dark legs, no revert on the pair, one price"
}
