{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // the MUNGED hub libraries, rebuilt by scripts/certora-munge.sh on every run: `extend` and `refinanceTo` inline here
    "files": [
        "verify/certora/munged/harness/ExtendHarness.sol",
        "verify/certora/munged/harness/DummyERC20.sol"
    ],
    "verify": "ExtendHarness:verify/certora/specs/ExtendAskOrder.spec",
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    // only the rules this spec adds: the Extend.spec rules it imports run in Extend.conf, with storage splitting on
    "rule": [
        "aSameSecondExtensionRefuses",
        "anExtensionRefusesFromExpiry",
        "anExtensionWritesNothingBeforeItsPolicyAnswers",
        "theStoreHookSeesAnExtensionsWrites",
        "aMaturedLoanNeverRefinances",
        "aRefinanceReusesTheClaimOnlyOnItsLendersYes"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    "smt_timeout": "3600",
    "global_timeout": "14400",
    // the spec's ALL_SSTORE hook is refused at rule setup unless storage splitting is off; a typecheck never reaches that step
    "prover_args": ["-enableEventReporting false", "-enableStorageSplitting false"],
    "msg": "Ace.extend and refinanceTo: no write before the lender's policy answers, and the refusals before any write or ask (O72, O72b)"
}
