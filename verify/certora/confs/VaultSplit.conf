{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // A plain ERC-20 as the vault's asset and a storage-only hub stand in the scene; the links fix the two immutables, and
    // the spec's DISPATCH list routes entry's outside reads and the asset's pull to them, which via-IR leaves unresolved.
    // the MUNGED vault: its thirteen forwarded verbs as typed internal calls, rebuilt by scripts/certora-munge-vault.sh on every
    // run; the caps and in-kind libraries stay in the scene for the vault's other, typed library calls and the share hook.
    // The terms and the door stay out of it, so their answers are NONDET.
    "files": [
        "verify/certora/munged-vault/harness/CuratorVaultHarness.sol",
        "verify/certora/munged-vault/src/curator/libraries/AceVaultCaps.sol",
        "verify/certora/munged-vault/src/curator/libraries/AceVaultInKind.sol",
        "verify/certora/munged-vault/harness/DummyERC20.sol",
        "verify/certora/munged-vault/harness/AceLenderView.sol"
    ],
    "verify": "CuratorVaultHarness:verify/certora/specs/VaultSplit.spec",
    "link": [
        "CuratorVaultHarness:_asset=DummyERC20",
        "CuratorVaultHarness:ACE=AceLenderView"
    ],
    "parametric_contracts": ["CuratorVaultHarness"],
    // v4-core is reached through the vault, not around it: the vault's flows import hub error types from Borrower,
    // and Borrower imports FullMath, so the mapping is needed to compile an AceVault at all
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    "prover_args": ["-enableEventReporting false"],
    "msg": "AceVault entry split-additivity, mulDiv exact, the asset and the hub read in the scene"
}
