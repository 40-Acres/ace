{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // AceVault's exit liveness: the exit gate on an extension, the requests' hold under an instant exit, and the 4626 exit views.
    // VaultSplit's scene: the MUNGED vault (rebuilt by scripts/certora-munge-vault.sh on every run), DummyERC20 as its asset,
    // AceLenderView as the hub (stored reads), and its three linked libraries. The terms and the door stay out of the scene,
    // so their answers are NONDET; the spec's DISPATCH list routes the asset and the two hub reads.
    "files": [
        "verify/certora/munged-vault/harness/VaultLivenessHarness.sol",
        "verify/certora/munged-vault/src/curator/AceVaultCaps.sol",
        "verify/certora/munged-vault/src/curator/AceVaultInKind.sol",
        "verify/certora/munged-vault/src/curator/AceVaultFlows.sol",
        "verify/certora/munged-vault/harness/DummyERC20.sol",
        "verify/certora/munged-vault/harness/AceLenderView.sol"
    ],
    "verify": "VaultLivenessHarness:verify/certora/specs/VaultLiveness.spec",
    "link": [
        "VaultLivenessHarness:_asset=DummyERC20",
        "VaultLivenessHarness:ACE=AceLenderView"
    ],
    "parametric_contracts": ["VaultLivenessHarness"],
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    "prover_args": ["-enableEventReporting false"],
    "msg": "AceVault exit liveness (munged): the exit gate, the requests' hold, and the exit views that never revert"
}
