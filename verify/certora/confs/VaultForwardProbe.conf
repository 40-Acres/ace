{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // the MUNGED vault: its thirteen forwarded verbs as typed internal calls, rebuilt by scripts/certora-munge-vault.sh on every run
    // REGRESSION ROW: each forwarded verb must run its library body on the vault's storage, rather than havoc it or no-op.
    // The caps and in-kind libraries stay in the scene for the vault's other, typed library calls; the hub, the terms and
    // the door are not, so their answers are NONDET.
    "files": [
        "verify/certora/munged-vault/harness/VaultForwardHarness.sol",
        "verify/certora/munged-vault/src/curator/libraries/AceVaultCaps.sol",
        "verify/certora/munged-vault/src/curator/libraries/AceVaultInKind.sol",
        "verify/certora/munged-vault/harness/DummyERC20.sol"
    ],
    "verify": "VaultForwardHarness:verify/certora/specs/VaultForwardProbe.spec",
    "link": [
        "VaultForwardHarness:_asset=DummyERC20"
    ],
    "parametric_contracts": ["VaultForwardHarness"],
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    "prover_args": ["-enableEventReporting false"],
    "msg": "AceVault forwarded verbs (munged): the thirteen verbs into AceVaultCaps, AceVaultInKind and AceVaultFlows"
}
