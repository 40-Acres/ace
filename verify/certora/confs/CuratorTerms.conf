{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // CuratorTerms, the curated AceVault's terms and door: the row timelock and its keys, the hooks' caller, the price,
    // the curator's sale over the 20% floor and where its cash goes, and the room.
    // Against `CuratorTermsHarness`, which adds one view and no state: whether the
    // transient reentrancy guard is entered, the premise a liveness rule over a guarded verb needs.
    // Every address the terms HOLD is LINKED to a mock of free storage (the vault, the hub, the asset); the record, the
    // goods and the buyer arrive as rows or arguments, so they are DISPATCHED by callee in the spec, never linked.
    "files": [
        "verify/certora/harness/CuratorTermsHarness.sol",
        "verify/certora/harness/DummyERC20.sol",
        "verify/certora/harness/MockGoods.sol",
        "verify/certora/harness/MockCuratedVault.sol",
        "verify/certora/harness/MockCuratedHub.sol",
        "verify/certora/harness/MockPairRecord.sol",
        "verify/certora/harness/MockSaleBuyer.sol"
    ],
    "verify": "CuratorTermsHarness:verify/certora/specs/CuratorTerms.spec",
    "link": [
        "CuratorTermsHarness:VAULT=MockCuratedVault",
        "CuratorTermsHarness:ACE=MockCuratedHub",
        "CuratorTermsHarness:ASSET=DummyERC20",
        "MockCuratedVault:cash=DummyERC20",
        "MockSaleBuyer:cash=DummyERC20"
    ],
    "parametric_contracts": ["CuratorTermsHarness"],
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    "prover_args": ["-enableEventReporting false"],
    "msg": "CuratorTerms: T the row timelock, H the hooks, P the price, D the curator sale and its floor, R the room"
}
