{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // Extend.conf's scene exactly: the MUNGED hub through ExtendHarness and a linked DummyERC20 as the quote
    "files": [
        "verify/certora/munged/harness/ExtendHarness.sol",
        "verify/certora/munged/harness/DummyERC20.sol"
    ],
    "verify": "ExtendHarness:verify/certora/specs/ExtendGrid.spec",
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    "smt_timeout": "3600",
    "global_timeout": "14400",
    // splitting off as its recorded verdict ran; the ALL_SSTORE hook that forced it now lives in ExtendAskOrder.spec, not Extend.spec
    "prover_args": ["-enableEventReporting false", "-enableStorageSplitting false"],
    "msg": "Ace.extend I2 grid rule on createMarket, the loan's market created (HubClaims aLoanSitsInACreatedMarket)"
}
