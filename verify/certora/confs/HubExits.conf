{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // the MUNGED hub and a plain ERC-20 standing in for one quote token -- HubSolvency's model
    "files": [
        "verify/certora/munged/harness/AceHarness.sol",
        "verify/certora/munged/harness/DummyERC20.sol"
    ],
    "verify": "AceHarness:verify/certora/specs/HubExits.spec",
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    "smt_timeout": "1800",
    "global_timeout": "14400",
    "prover_args": ["-enableEventReporting false -depth 16 -dontStopAtFirstSplitTimeout true -mediumTimeout 60"],
    "msg": "Ace hub: exit destinations -- collect pays its recipient, revenue reaches the treasury"
}
