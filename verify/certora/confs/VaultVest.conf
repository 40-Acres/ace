{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // The vest's three writes, alone: the harness calls the vault's own _stampVest, _burnVest and _release, so no hub, product
    // or dispatch enters a rule. The MUNGED vault, as every vault conf takes it, so the harness and the vault share one set of
    // types; all three libraries are in the scene, as in every vault conf, so no linked call can fall to a NONDET no-op.
    "files": [
        "verify/certora/munged-vault/harness/VaultVestHarness.sol",
        "verify/certora/munged-vault/src/curator/AceVaultCaps.sol",
        "verify/certora/munged-vault/src/curator/AceVaultInKind.sol",
        "verify/certora/munged-vault/src/curator/AceVaultFlows.sol"
    ],
    "verify": "VaultVestHarness:verify/certora/specs/VaultVest.spec",
    // v4-core because the vault's flows import hub error types, and the hub's Borrower imports FullMath from it
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    "prover_args": ["-enableEventReporting false"],
    "msg": "AceVault vest at its three writes, mulDiv exact"
}
