{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // V-3's clone half: the receipt `make` builds carries the caller as PORTFOLIO, the stake as STAKE_ID and its amount
    // as UNITS. THE FACTORY IS MUNGED, ONE LINE AND ONE HOOK: scripts/certora-munge-factory.sh routes make's Clones call
    // through a virtual hook the harness records, and certora-run.sh rebuilds verify/certora/munged-factory/ every run.
    // The mocks and their DISPATCH are SaeroStakeReceiptFactory.conf's; see verify/certora/specs/SaeroStakeReceiptFactoryClone.spec.
    "files": [
        "verify/certora/munged-factory/harness/SAeroStakeReceiptFactoryHarness.sol",
        "verify/certora/munged-factory/harness/MockStakeEscrow.sol",
        "verify/certora/munged-factory/harness/MockFortyAcresFactory.sol",
        "verify/certora/munged-factory/harness/MockStakePortfolio.sol",
        "verify/certora/munged-factory/harness/MockReceiptClone.sol"
    ],
    "verify": "SAeroStakeReceiptFactoryHarness:verify/certora/specs/SaeroStakeReceiptFactoryClone.spec",
    "link": [
        "SAeroStakeReceiptFactoryHarness:ESCROW=MockStakeEscrow",
        "SAeroStakeReceiptFactoryHarness:PORTFOLIO_FACTORY=MockFortyAcresFactory"
    ],
    "parametric_contracts": ["SAeroStakeReceiptFactoryHarness"],
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    "prover_args": ["-enableEventReporting false"],
    "msg": "sAERO receipt factory: the clone make builds carries the caller, the stake and its amount"
}
