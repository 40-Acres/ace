{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // MultiPairOracleRecord, the owner-registered many-pair record: MP-0..MP-4 of verify/certora/specs/MultiPairOracleRecord.spec
    // MultiPairOracleRecordHarness IS the record plus getters and no state, so every method under test is the record's.
    // NOTHING IS LINKED: a pair's feed and tokens are `registerPair` arguments, dispatched by address. Two feed
    // contracts with their own storage let one rule move one feed and read a pair priced off the other.
    "files": [
        "verify/certora/harness/MultiPairOracleRecordHarness.sol",
        "verify/certora/harness/MockPriceFeed.sol",
        "verify/certora/harness/MockPriceFeed.sol:MockPriceFeedB",
        "verify/certora/harness/MockPairToken.sol:MockQuoteToken",
        "verify/certora/harness/MockPairToken.sol:MockCollateralToken"
    ],
    "verify": "MultiPairOracleRecordHarness:verify/certora/specs/MultiPairOracleRecord.spec",
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    "prover_args": ["-enableEventReporting false"],
    "msg": "MultiPairOracleRecord: registration's frame and rails, write-once, per-pair reads, independence"
}
