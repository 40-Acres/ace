{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // THE SETTLE TWIN'S WALK RULES of verify/certora/specs/SaeroRecord.spec, at the walk's own depth: REC-5's implication,
    // its witness and the settle twin's no-panic half. The same scene as SaeroRecord.conf, which excludes these three.
    // PESSIMISTIC AT 64, NEVER OPTIMISTIC: the walk reads at most MAX_HOLD_ROUNDS (64) past rounds, so unrolling it 64 times
    // covers every walk, and the unwinding check holds by the loop's own bound rather than pruning a longer one.
    "files": [
        "verify/certora/harness/RecordHarness.sol",
        "verify/certora/harness/MockAggregator.sol",
        "verify/certora/harness/MockSequencer.sol",
        "verify/certora/harness/MockStakeAccount.sol",
        "verify/certora/harness/MockAccountFactory.sol"
    ],
    "verify": "RecordHarness:verify/certora/specs/SaeroRecord.spec",
    "rule": ["theSettleTwinImpliesTheDistressTwin", "theSettleTwinCanAnswerBelow", "theSettleTwinNeverPanics"],
    "link": [
        "RecordHarness:FEED=MockAggregator",
        "RecordHarness:SEQUENCER_FEED=MockSequencer",
        "RecordHarness:FACTORY=MockAccountFactory"
    ],
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "loop_iter": "64",
    "rule_sanity": "basic",
    "prover_args": ["-enableEventReporting false"],
    "msg": "sAERO record: the settle twin's walk at its full 64 rounds, REC-5 and its no-panic half"
}
