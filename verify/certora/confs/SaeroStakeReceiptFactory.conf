{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // V-3's factory half of the internal record, over `make`: the receipt registry and `latest` are written only
    // by `make` and only for the receipt it returns (O82); H-2, one receipt per portfolio and stake with units out; L-D
    // and its siblings, the refusals of a caller or a stake `make` must not take.
    // OZ Clones' packed bytecode build defeats the pointer analysis on `make` under via-IR, so no call in it resolves and
    // the links below never bind there; the spec dispatches each unresolved call to the mock at its callee, and any other
    // is NONDET. The links stay so that the scene is wired as deployed if the analysis ever succeeds, and they put the
    // escrow and the 40 Acres factory at their mocks' addresses. See the spec header for why none of it weakens a rule.
    // SAeroStakeReceipt rides in because the constructor builds the implementation; no rule executes its code.
    "files": [
        "src/entities/saero/SAeroStakeReceiptFactory.sol",
        "verify/certora/harness/MockStakeEscrow.sol",
        "verify/certora/harness/MockFortyAcresFactory.sol",
        "verify/certora/harness/MockStakePortfolio.sol",
        "verify/certora/harness/MockReceiptClone.sol"
    ],
    "verify": "SAeroStakeReceiptFactory:verify/certora/specs/SaeroStakeReceiptFactory.spec",
    "link": [
        "SAeroStakeReceiptFactory:ESCROW=MockStakeEscrow",
        "SAeroStakeReceiptFactory:PORTFOLIO_FACTORY=MockFortyAcresFactory"
    ],
    "parametric_contracts": ["SAeroStakeReceiptFactory"],
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    "prover_args": ["-enableEventReporting false"],
    "msg": "sAERO receipt factory: V-3 the registry and latest only make writes, H-2 one live receipt per stake, L-D the refusals"
}
