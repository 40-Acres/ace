{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // VaultBoundary's scene and spec over the vault copy PINNED to `drawMoreFor` (scripts/certora-munge-vault.sh item 5): its
    // forward runs only that verb's branch and refuses every other selector, so the top-up's program no longer carries the
    // other twelve forwarded bodies. Exact for a rule that calls only `drawMoreFor`, and for a parametric rule run with
    // --method on `drawMoreFor`; never for another forwarded verb, which reverts here, so the conf names its rules.
    "files": [
        "verify/certora/munged-vault-pin-drawMoreFor/harness/VaultBoundaryHarness.sol",
        "verify/certora/munged-vault-pin-drawMoreFor/src/curator/AceVaultCaps.sol",
        "verify/certora/munged-vault-pin-drawMoreFor/src/curator/AceVaultInKind.sol",
        "verify/certora/munged-vault-pin-drawMoreFor/src/curator/AceVaultFlows.sol",
        "verify/certora/munged-vault-pin-drawMoreFor/harness/DummyERC20.sol",
        "verify/certora/munged-vault-pin-drawMoreFor/harness/BoundaryHub.sol",
        "verify/certora/munged-vault-pin-drawMoreFor/harness/BoundaryTitle.sol"
    ],
    "verify": "VaultBoundaryHarness:verify/certora/specs/VaultBoundary.spec",
    "link": [
        "VaultBoundaryHarness:_asset=DummyERC20",
        "VaultBoundaryHarness:ACE=BoundaryHub",
        "VaultBoundaryHarness:TITLE=BoundaryTitle",
        "BoundaryHub:title=BoundaryTitle",
        "BoundaryHub:cash=DummyERC20"
    ],
    "parametric_contracts": ["VaultBoundaryHarness"],
    "rule": ["aDrawMoreForActsOnlyForTheHolder", "aTopUpFitsTheTotal"],
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    "prover_args": ["-enableEventReporting false", "-maxCommandCount 4000000"],
    "msg": "AceVault boundary (munged, pinned to drawMoreFor): the top-up door's rules"
}
