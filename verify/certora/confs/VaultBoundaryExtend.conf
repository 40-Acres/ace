{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // VaultBoundary's scene and spec over the vault copy PINNED to `extendFor` (scripts/certora-munge-vault.sh item 5), as
    // VaultBoundaryRefinance.conf: exact for a rule that calls only `extendFor`, and for a parametric rule run with --method on
    // `extendFor`; never for another forwarded verb, which reverts here, so the conf names its rules.
    "files": [
        "verify/certora/munged-vault-pin-extendFor/harness/VaultBoundaryHarness.sol",
        "verify/certora/munged-vault-pin-extendFor/src/vault/libraries/AceVaultCaps.sol",
        "verify/certora/munged-vault-pin-extendFor/src/vault/libraries/AceVaultInKind.sol",
        "verify/certora/munged-vault-pin-extendFor/src/vault/libraries/AceVaultFlows.sol",
        "verify/certora/munged-vault-pin-extendFor/harness/DummyERC20.sol",
        "verify/certora/munged-vault-pin-extendFor/harness/BoundaryHub.sol",
        "verify/certora/munged-vault-pin-extendFor/harness/BoundaryTitle.sol"
    ],
    "verify": "VaultBoundaryHarness:verify/certora/specs/VaultBoundary.spec",
    "link": [
        "VaultBoundaryHarness:_asset=DummyERC20",
        "VaultBoundaryHarness:ACE=BoundaryHub",
        "VaultBoundaryHarness:TITLE=BoundaryTitle",
        "BoundaryHub:title=BoundaryTitle",
        "BoundaryHub:cash=DummyERC20"
    ],
    "parametric_contracts": ["VaultBoundaryHarness"],
    "rule": ["anExtendForActsOnlyForTheHolder"],
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    "prover_args": ["-enableEventReporting false", "-maxCommandCount 4000000"],
    "msg": "AceVault boundary (munged, pinned to extendFor): the extension door's rules"
}
