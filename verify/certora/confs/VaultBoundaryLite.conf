{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // VaultBoundary's vault-side rules over the twelve forwarded verbs, in a lighter scene: the MUNGED vault (rebuilt by
    // scripts/certora-munge-vault.sh on every run), DummyERC20 as its asset, and its three linked libraries. No hub, title,
    // terms or door is in the scene, so every answer they give is NONDET; the spec's DISPATCH list routes only the asset.
    "files": [
        "verify/certora/munged-vault/harness/VaultBoundaryHarness.sol",
        "verify/certora/munged-vault/src/curator/libraries/AceVaultCaps.sol",
        "verify/certora/munged-vault/src/curator/libraries/AceVaultInKind.sol",
        "verify/certora/munged-vault/src/curator/libraries/AceVaultFlows.sol",
        "verify/certora/munged-vault/harness/DummyERC20.sol"
    ],
    "verify": "VaultBoundaryHarness:verify/certora/specs/VaultBoundaryLite.spec",
    "link": [
        "VaultBoundaryHarness:_asset=DummyERC20"
    ],
    "parametric_contracts": ["VaultBoundaryHarness"],
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    // the default command bound: VaultForwardProbe, the same vault, libraries and asset DISPATCH with no hub, built every
    // forwarded verb under it; the full scene's excess came from the hub and title DISPATCH candidates this scene drops
    "prover_args": ["-enableEventReporting false"],
    "msg": "AceVault boundary, lite (munged): the vault-side rules over its forwarded verbs, with the hub, title and product NONDET"
}
