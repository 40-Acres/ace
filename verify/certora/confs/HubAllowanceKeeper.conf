{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // HubAllowance.conf's scene exactly: the MUNGED hub, the real custodian bound both ways, DummyERC20, the part-filling keeper
    // the spec adds one summary, the deleverage keeper's callback dispatched to DeleverageKeeper, and re-uses HubAllowance.spec's rules
    "files": [
        "verify/certora/munged/harness/AceHarness.sol",
        "verify/certora/munged/harness/PositionManagerHarness.sol",
        "verify/certora/munged/harness/DummyERC20.sol",
        "verify/certora/munged/harness/DeleverageKeeper.sol"
    ],
    "link": [
        "AceHarness:POSITION_MANAGER=PositionManagerHarness",
        "PositionManagerHarness:LOAN_MANAGER=AceHarness",
        "DeleverageKeeper:token=DummyERC20"
    ],
    "verify": "AceHarness:verify/certora/specs/HubAllowanceKeeper.spec",
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    "prover_args": ["-enableEventReporting false"],
    "msg": "Ace hub: O45 no hub allowance outlives deleverage, the keeper callback dispatched to the keeper model"
}
