{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // V-1, V-3's vault half and V-4 of the internal record, against SAeroTerms ITSELF -- NO HARNESS.
    // SAeroTerms is the sAERO vault's terms and door, an Initializable behind a transparent proxy: the bid, the dials and
    // the listing floor live there. `derivedPrice` and `listFloor` are already public, so the pricing properties need no
    // subclass, and adding one cost real money: instrumenting a subclass of the old vault made solc fail the autofinder
    // pass under via-IR ("Builtin function add must be called"), which silently degrades internal-function detection for
    // the WHOLE scene -- so the `FullMath.mulDiv` and `PriceGrid.down` summaries stop binding and the analysis crawls.
    // A rule starts from an arbitrary state of the terms, so the proxy, the constructor and `initialize` never run here.
    // V-2 needs the market the terms build, and a subclass is how a spec would reach it -- with no vault base under the
    // terms the instrumentation failure may not recur, so V-2 is worth a fresh try. Owed: see the findings file, finding 4.
    // SAeroTermsFlows is the terms' DELEGATECALL-linked dial library, listed so `listFloor`'s call into it resolves
    "files": [
        "src/entities/saero/SAeroTerms.sol",
        "src/entities/saero/SAeroTermsFlows.sol",
        "verify/certora/harness/MockRecord.sol",
        "verify/certora/harness/MockSAeroStakeReceipt.sol",
        "verify/certora/harness/MockAccountFactory.sol"
    ],
    "verify": "SAeroTerms:verify/certora/specs/SaeroVault.spec",
    // The record and the factory are addresses the TERMS HOLD, so `link` binds them. The RECEIPT is not here and
    // cannot be: it arrives as a call argument, so it is DISPATCHED instead -- see the spec header.
    "link": [
        "SAeroTerms:RECORD=MockRecord",
        "SAeroTerms:FACTORY=MockAccountFactory"
    ],
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    // PriceGrid is a linked library of tick math; the spec summarizes `down` rather than unrolling it, see the header
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    "prover_args": ["-enableEventReporting false"],
    // RUN in the pre-deploy pass (emv-97, the internal record row B), on
    // the forms the settings timelock, the simplicity cuts and the size curve left: 14 SUCCESS, among them V-2's door rule
    // `onlySettingsMovesTheDials` on all 12 mutators; the curve-aware exact bid TIMED OUT and is UNPROVEN. Its cap leg,
    // `theBidNeverExceedsTheCap`, was added after that run and is proven on its own (findings/certora-saero-runway-2026-11-13.md).
    "msg": "sAERO terms: V-1 the derived bid, V-2 the dials' door, V-4 the listing floor"
}
