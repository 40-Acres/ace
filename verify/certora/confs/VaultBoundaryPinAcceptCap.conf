{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // VaultBoundary's scene and spec over the vault copy PINNED to `acceptCap` (scripts/certora-munge-vault.sh item 5):
    // exact for the four parametric rules below run with --method on it; never for another forwarded verb, which reverts here.
    "files": [
        "verify/certora/munged-vault-pin-acceptCap/harness/VaultBoundaryHarness.sol",
        "verify/certora/munged-vault-pin-acceptCap/src/curator/AceVaultCaps.sol",
        "verify/certora/munged-vault-pin-acceptCap/src/curator/AceVaultInKind.sol",
        "verify/certora/munged-vault-pin-acceptCap/src/curator/AceVaultFlows.sol",
        "verify/certora/munged-vault-pin-acceptCap/harness/DummyERC20.sol",
        "verify/certora/munged-vault-pin-acceptCap/harness/BoundaryHub.sol",
        "verify/certora/munged-vault-pin-acceptCap/harness/BoundaryTitle.sol"
    ],
    "verify": "VaultBoundaryHarness:verify/certora/specs/VaultBoundary.spec",
    "link": [
        "VaultBoundaryHarness:_asset=DummyERC20",
        "VaultBoundaryHarness:ACE=BoundaryHub",
        "VaultBoundaryHarness:TITLE=BoundaryTitle",
        "BoundaryHub:title=BoundaryTitle",
        "BoundaryHub:cash=DummyERC20"
    ],
    "parametric_contracts": ["VaultBoundaryHarness"],
    "rule": ["noVerbLeavesCashResting", "noVerbLeavesATitleOnTheVault", "idleFallsOnlyAtAnExitOrIntoTheHub", "theHubOpensOnlyToTheVault"],
    "method": ["acceptCap(address)"],
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    "prover_args": ["-enableEventReporting false", "-maxCommandCount 4000000"],
    "msg": "AceVault boundary (munged, pinned to acceptCap): the four every-verb rules"
}
