{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // PriceGrid.down's two facts every vault door's spec assumes as axioms, down(p) <= p and down(0) == 0, proven of the
    // library over the documented contracts of the OZ and v4 functions it calls; verify/certora/specs/PriceGrid.spec
    // argues each summary. The harness calls the linked library, which is listed so the call resolves.
    // `relaxed` finder mode so the internal summaries can bind on functions via-IR would otherwise inline away.
    // DOES NOT RUN YET: two of the summaries (Math.log2, TickMath.getTickAtSqrtPrice) cannot be located in either finder
    // mode, so the run errors and its FAILs are havoc, not verdicts. See the spec header.
    "files": [
        "verify/certora/harness/PriceGridHarness.sol",
        "src/curator/libraries/PriceGrid.sol"
    ],
    "verify": "PriceGridHarness:verify/certora/specs/PriceGrid.spec",
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "function_finder_mode": "relaxed",
    "rule_sanity": "basic",
    "prover_args": ["-enableEventReporting false"],
    "msg": "PriceGrid: down never rounds a price up and is zero at zero, over the OZ and v4 functions documented contracts"
}
