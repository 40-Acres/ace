{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // SAeroTerms as the vault's door (#876, V-18, V-19 and X-1's per-verb halves): custody rewards to the vault under the
    // asset key, a sale's and a sweep's return against the receipt and when it closes the key, and a receipt's later cash.
    // The terms run with no harness, as in SaeroTerms.conf; the vault, the factory and the asset are LINKED to mocks, and
    // the receipt, which arrives as an argument, is DISPATCHED; verify/certora/specs/SaeroTermsDoor.spec argues each.
    // SAeroTermsFlows is the terms' DELEGATECALL-linked dial library, listed so any call into it resolves.
    "files": [
        "src/entities/saero/SAeroTerms.sol",
        "src/entities/saero/SAeroTermsFlows.sol",
        "verify/certora/harness/DummyERC20.sol",
        "verify/certora/harness/MockDoorVault.sol",
        "verify/certora/harness/MockDoorReceipt.sol",
        "verify/certora/harness/MockAccountFactory.sol"
    ],
    "verify": "SAeroTerms:verify/certora/specs/SaeroTermsDoor.spec",
    "link": [
        "SAeroTerms:VAULT=MockDoorVault",
        "SAeroTerms:ASSET=DummyERC20",
        "SAeroTerms:FACTORY=MockAccountFactory",
        "MockDoorVault:cash=DummyERC20",
        "MockDoorReceipt:cash=DummyERC20"
    ],
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    "prover_args": ["-enableEventReporting false"],
    "msg": "sAERO terms door: custody rewards, a sale and a sweep returned against their receipt, and later cash"
}
