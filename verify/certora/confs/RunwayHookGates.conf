{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // RunwayHook's window correctness (the roll, the read and the swap callback keep every low and high their window
    // covers) and its registration gate (only the strategy, only by launchBy; authorized() only while launching).
    // The scene is verify/certora/harness/RunwayHookProof.sol, the hook with key-field entry points, and the launch
    // factory LINKED to MockLaunchPools; the spec header argues both.
    "files": [
        "verify/certora/harness/RunwayHookProof.sol",
        "verify/certora/harness/MockLaunchPools.sol"
    ],
    "verify": "RunwayHookProof:verify/certora/specs/RunwayHookGates.spec",
    "link": [
        "RunwayHookProof:FACTORY=MockLaunchPools"
    ],
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "rule_sanity": "basic",
    "prover_args": ["-enableEventReporting false"],
    "msg": "RunwayHook: the window keeps its lows and highs, the registration gate, and authorized()"
}
