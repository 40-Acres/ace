{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // parametric_contracts keeps the parametric rules on the vault. Its queue library (CuratorVaultQueue) went with the
    // queue, so the vault alone is the scene.
    "files": ["verify/certora/harness/CuratorVaultHarness.sol"],
    "verify": "CuratorVaultHarness:verify/certora/specs/VaultArithmetic.spec",
    "parametric_contracts": ["CuratorVaultHarness"],
    // v4-core because the vault's flows import hub error types, and the hub's Borrower imports FullMath from it
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    "prover_args": ["-enableEventReporting false"],
    "msg": "CuratorVault arithmetic, mulDiv exact"
}
