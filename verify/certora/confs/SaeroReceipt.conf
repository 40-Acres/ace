{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // R1-R5 of the receipt, the A-* properties of the internal record: the payout order, the lenders' fee, cash
    // conservation, the units' burn-on-exit rule and the reward repay's gate and bound, each with a reachability witness.
    // PROVEN in the pre-deploy pass: 34 of the 37 rules SUCCESS, every witness found, a LENDER_FEE_BPS = 400 mutant
    // caught. The other 3 are the three invariants' constructor base case, ARGUED, not proven, as the spec says.
    // THE RECEIPT IS MUNGED, ONE LINE: its clone args are an EXTCODECOPY of itself, which the prover havocs per site, so
    // `_args()` is made virtual and the harness answers three storage words no function writes. scripts/certora-munge-receipt.sh
    // builds verify/certora/munged-receipt/ (gitignored) and argues the equivalence; certora-run.sh rebuilds it every run.
    // Every address the receipt HOLDS and calls is LINKED to a mock whose answers are storage the prover sets, and the
    // asset is a plain DummyERC20 that the receipt, the hub's repay and the door's pull all move, so cash is real.
    "files": [
        "verify/certora/munged-receipt/harness/SAeroStakeReceiptHarness.sol",
        "verify/certora/munged-receipt/harness/DummyERC20.sol",
        "verify/certora/munged-receipt/harness/MockReceiptHub.sol",
        "verify/certora/munged-receipt/harness/MockReceiptDoor.sol",
        "verify/certora/munged-receipt/harness/MockReceiptVenue.sol:MockPortfolioOwners",
        "verify/certora/munged-receipt/harness/MockReceiptVenue.sol:MockSeizedCustody",
        "verify/certora/munged-receipt/harness/MockReceiptVenue.sol:MockListings",
        "verify/certora/munged-receipt/harness/MockStakeEscrow.sol"
    ],
    "verify": "SAeroStakeReceiptHarness:verify/certora/specs/SaeroReceipt.spec",
    "link": [
        "SAeroStakeReceiptHarness:ACE=MockReceiptHub",
        "SAeroStakeReceiptHarness:DOOR=MockReceiptDoor",
        "SAeroStakeReceiptHarness:CASH=DummyERC20",
        "SAeroStakeReceiptHarness:ESCROW=MockStakeEscrow",
        "SAeroStakeReceiptHarness:CUSTODY=MockSeizedCustody",
        "SAeroStakeReceiptHarness:PORTFOLIO_FACTORY=MockPortfolioOwners",
        "SAeroStakeReceiptHarness:MARKETPLACE=MockListings",
        "MockReceiptHub:cash=DummyERC20",
        "MockReceiptDoor:cash=DummyERC20"
    ],
    "parametric_contracts": ["SAeroStakeReceiptHarness"],
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    "prover_args": ["-enableEventReporting false"],
    "msg": "sAERO receipt: R1 payout order, R2 the lenders' fee, R3 cash conservation, R4 units burn on exit, R5 the repay gate and bound"
}
