{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // AceVault's lending doors leave the requests' hold home. VaultBoundary's scene: the MUNGED vault (rebuilt by
    // scripts/certora-munge-vault.sh on every run), a plain ERC-20 as the asset, a storage hub that records what the vault asks
    // and moves the asset as the hub does, and a title collection; the links fix the addresses they are read from, and the
    // spec's DISPATCH list routes the calls, which via-IR leaves unresolved. The terms and the door stay out of the scene.
    "files": [
        "verify/certora/munged-vault/harness/VaultLivenessHarness.sol",
        "verify/certora/munged-vault/src/curator/AceVaultCaps.sol",
        "verify/certora/munged-vault/src/curator/AceVaultInKind.sol",
        "verify/certora/munged-vault/src/curator/AceVaultFlows.sol",
        "verify/certora/munged-vault/harness/DummyERC20.sol",
        "verify/certora/munged-vault/harness/BoundaryHub.sol",
        "verify/certora/munged-vault/harness/BoundaryTitle.sol"
    ],
    "verify": "VaultLivenessHarness:verify/certora/specs/VaultLendingHold.spec",
    "link": [
        "VaultLivenessHarness:_asset=DummyERC20",
        "VaultLivenessHarness:ACE=BoundaryHub",
        "VaultLivenessHarness:TITLE=BoundaryTitle",
        "BoundaryHub:title=BoundaryTitle",
        "BoundaryHub:cash=DummyERC20"
    ],
    "parametric_contracts": ["VaultLivenessHarness"],
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    // a forwarded verb inlines the munged dispatch and, at each hub, asset or title call, the DISPATCH candidates: past the
    // prover's default one million commands, so the bound is raised rather than the dispatch narrowed, as VaultBoundary does
    "prover_args": ["-enableEventReporting false", "-maxCommandCount 4000000"],
    "msg": "AceVault lending doors (munged): a borrow and a refinance leave the requests' hold home"
}
