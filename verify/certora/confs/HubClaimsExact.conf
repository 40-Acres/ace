    "files": ["verify/certora/munged/harness/AceHarness.sol"],
    "verify": "AceHarness:verify/certora/specs/HubClaimsExact.spec",
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    "smt_timeout": "3600",
    "global_timeout": "28800",
    "prover_args": ["-enableEventReporting false -depth 16 -dontStopAtFirstSplitTimeout true -mediumTimeout 60"],
    "msg": "Ace hub: O10 on deleverage, exact mulDiv, split on which loan is sold"
}
