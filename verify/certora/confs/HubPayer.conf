{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // the MUNGED hub: its six libraries inlined, rebuilt by scripts/certora-munge.sh on every run
    "files": [
        "verify/certora/munged/harness/AceHarness.sol",
        "verify/certora/munged/harness/PullRecorder.sol"
    ],
    "verify": "AceHarness:verify/certora/specs/HubPayer.spec",
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    "prover_args": ["-enableEventReporting false"],
    "msg": "Ace hub: O45 a collateral pull names the caller or the hub"
}
