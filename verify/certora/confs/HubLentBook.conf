{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // the MUNGED hub and its storage-link harness, which names the ERC-7201 roots the hooks reach
    "files": [
        "verify/certora/munged/harness/AceHarness.sol",
        "verify/certora/munged/harness/AceStorageLink.sol"
    ],
    "verify": "AceHarness:verify/certora/specs/HubLentBook.spec",
    "storage_extension_harnesses": ["AceHarness=AceStorageLink"],
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    "prover_args": ["-enableEventReporting false"],
    "msg": "Ace hub: O4 the lent leg is the claim book"
}
