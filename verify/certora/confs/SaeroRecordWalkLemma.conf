{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // THE WALK'S CONTRACT, the lemma the settle twin's implication is proven over: an undoubted walk never lowers the high
    // it was handed. SaeroRecordWalk.conf's scene through RecordWalkHarness, which adds one entry point onto `_walk`.
    // PESSIMISTIC AT 64, NEVER OPTIMISTIC: the walk reads at most MAX_HOLD_ROUNDS (64) past rounds.
    "files": [
        "verify/certora/harness/RecordWalkHarness.sol",
        "verify/certora/harness/MockAggregator.sol",
        "verify/certora/harness/MockSequencer.sol",
        "verify/certora/harness/MockStakeAccount.sol",
        "verify/certora/harness/MockAccountFactory.sol"
    ],
    "verify": "RecordWalkHarness:verify/certora/specs/SaeroRecordWalkLemma.spec",
    "link": [
        "RecordWalkHarness:FEED=MockAggregator",
        "RecordWalkHarness:SEQUENCER_FEED=MockSequencer",
        "RecordWalkHarness:FACTORY=MockAccountFactory"
    ],
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "loop_iter": "64",
    "rule_sanity": "basic",
    "prover_args": ["-enableEventReporting false"],
    "msg": "sAERO record: the settle walk never lowers the high it was handed, at its full 64 rounds"
}
