{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // OracleRecord, the single-pair Chainlink-shaped record: OR-0..OR-7 of verify/certora/specs/OracleRecord.spec
    // OracleRecordHarness IS OracleRecord plus getters and no state, so every method under test is the record's.
    // NOTHING IS LINKED, deliberately: the feed and both tokens are constructor arguments, and a link would bind the
    // immutable without binding the argument the constructor reads decimals off. The spec DISPATCHES them by address.
    "files": [
        "verify/certora/harness/OracleRecordHarness.sol",
        "verify/certora/harness/MockPriceFeed.sol",
        "verify/certora/harness/MockPairToken.sol:MockQuoteToken",
        "verify/certora/harness/MockPairToken.sol:MockCollateralToken"
    ],
    "verify": "OracleRecordHarness:verify/certora/specs/OracleRecord.spec",
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    "prover_args": ["-enableEventReporting false"],
    "msg": "OracleRecord: the frame, the exact price, the dark legs, no revert on the pair, one price"
}
