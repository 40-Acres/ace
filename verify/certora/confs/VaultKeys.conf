{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // AceVault's keys: who may move each piece of privileged state over every verb, the door-only verbs, and each holder's request.
    // VaultBoundaryLite's scene: the MUNGED vault (rebuilt by scripts/certora-munge-vault.sh on every run), DummyERC20 as its
    // asset, and its three linked libraries. No hub, title, terms or door is in the scene, so every answer they give is
    // NONDET; the spec's DISPATCH list routes only the asset.
    "files": [
        "verify/certora/munged-vault/harness/VaultLivenessHarness.sol",
        "verify/certora/munged-vault/src/curator/libraries/AceVaultCaps.sol",
        "verify/certora/munged-vault/src/curator/libraries/AceVaultInKind.sol",
        "verify/certora/munged-vault/src/curator/libraries/AceVaultFlows.sol",
        "verify/certora/munged-vault/harness/DummyERC20.sol"
    ],
    "verify": "VaultLivenessHarness:verify/certora/specs/VaultKeys.spec",
    "link": [
        "VaultLivenessHarness:_asset=DummyERC20"
    ],
    "parametric_contracts": ["VaultLivenessHarness"],
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    "prover_args": ["-enableEventReporting false"],
    "msg": "AceVault keys (munged): who moves privileged state, the door-only verbs, and each holder's exit request"
}
