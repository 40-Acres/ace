{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // HubCustody.conf's scene exactly: the MUNGED hub and the real custodian, bound both ways as the hub's constructor requires
    // the spec adds one summary, the deleverage keeper's callback as NONDET, and re-uses HubCustody.spec's three invariants
    "files": [
        "verify/certora/munged/harness/AceHarness.sol",
        "verify/certora/munged/harness/PositionManagerHarness.sol"
    ],
    "link": ["AceHarness:POSITION_MANAGER=PositionManagerHarness", "PositionManagerHarness:LOAN_MANAGER=AceHarness"],
    "verify": "AceHarness:verify/certora/specs/HubCustodyKeeper.spec",
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    "prover_args": ["-enableEventReporting false"],
    "msg": "Ace hub: O5 custody on deleverage, the keeper callback summarized as NONDET"
}
