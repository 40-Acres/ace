{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // the MUNGED vault: its thirteen forwarded verbs as typed internal calls, rebuilt by scripts/certora-munge-vault.sh on every run.
    // A plain ERC-20 as the asset, a storage hub that records what the vault asks and moves the asset as the hub does, and a
    // title collection stand in the scene; the links fix the addresses they are read from, and the spec's DISPATCH list
    // routes the calls, which via-IR leaves unresolved. The terms and the door stay out of the scene, so their answers are NONDET.
    "files": [
        "verify/certora/munged-vault/harness/VaultBoundaryHarness.sol",
        "verify/certora/munged-vault/src/vault/libraries/AceVaultCaps.sol",
        "verify/certora/munged-vault/src/vault/libraries/AceVaultInKind.sol",
        "verify/certora/munged-vault/src/vault/libraries/AceVaultFlows.sol",
        "verify/certora/munged-vault/harness/DummyERC20.sol",
        "verify/certora/munged-vault/harness/BoundaryHub.sol",
        "verify/certora/munged-vault/harness/BoundaryTitle.sol"
    ],
    "verify": "VaultBoundaryHarness:verify/certora/specs/VaultBoundary.spec",
    "link": [
        "VaultBoundaryHarness:_asset=DummyERC20",
        "VaultBoundaryHarness:ACE=BoundaryHub",
        "VaultBoundaryHarness:TITLE=BoundaryTitle",
        "BoundaryHub:title=BoundaryTitle",
        "BoundaryHub:cash=DummyERC20"
    ],
    "parametric_contracts": ["VaultBoundaryHarness"],
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    // a forwarded verb inlines the munged dispatch and, at each hub, asset or title call, the DISPATCH candidates: past the
    // prover's default one million commands, so the bound is raised rather than the dispatch narrowed
    "prover_args": ["-enableEventReporting false", "-maxCommandCount 4000000"],
    "msg": "AceVault boundary (munged): what the vault enforces whatever its terms and door answer"
}
