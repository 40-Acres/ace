{
    // run via scripts/certora-run.sh, which compiles with the deploy profile's settings (via-IR) from foundry.toml
    // YbRecord, the YieldBasis collateral record: YB-0..YB-7 of verify/certora/specs/YbRecord.spec, both market shapes
    // (an LT market and a gauge market) in one scene, since GAUGE is an immutable the prover leaves free.
    // YbRecordHarness IS YbRecord plus getters and no state, so every method under test is the record's.
    // NOTHING IS LINKED, for OracleRecord.conf's reason: every party is a constructor argument, dispatched by address.
    "files": [
        "verify/certora/harness/YbRecordHarness.sol",
        "verify/certora/harness/MockPriceFeed.sol",
        "verify/certora/harness/MockYbLt.sol",
        "verify/certora/harness/MockYbGauge.sol",
        "verify/certora/harness/MockPairToken.sol:MockQuoteToken",
        "verify/certora/harness/MockPairToken.sol:MockUnderlyingToken"
    ],
    "verify": "YbRecordHarness:verify/certora/specs/YbRecord.spec",
    "packages": [
        "@openzeppelin=lib/openzeppelin-contracts",
        "@uniswap/v4-core=lib/v4-core"
    ],
    "optimistic_loop": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    "prover_args": ["-enableEventReporting false"],
    "msg": "YbRecord: the constructor's rails, the exact draw cap at the lower rate, the twins at the accounting rate, the dent, no revert"
}
