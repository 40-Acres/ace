[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.36"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = false
gas_limit = 3000000000 # a few sweep tests run a whole scenario in one frame, past the 2^30 default
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@uniswap/v4-core/=lib/v4-core/",
    "solmate/=lib/v4-core/lib/solmate/",
    "@openzeppelin/=lib/openzeppelin-contracts/",
]

# The deployed bytecode is compiled via-IR: `FOUNDRY_PROFILE=deploy forge build` reproduces it.
[profile.deploy]
via_ir = true
out = "out-ir"
cache_path = "cache-ir"

[fuzz]
seed = "0x1"

[invariant]
runs = 256
depth = 32
fail_on_revert = false
call_override = false

[fmt]
line_length = 160
wrap_comments = true
